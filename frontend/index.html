<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple task manager connected to the Task Management API">
  <title>Taskboard | Task Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Taskboard home">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span>taskboard</span>
      </a>
      <button class="button button-ghost" id="refresh-button" type="button">
        <span class="button-icon" aria-hidden="true">↻</span> Refresh
      </button>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">YOUR WORKSPACE</p>
          <h1 id="page-title">Make progress visible.</h1>
          <p class="intro-copy">Keep the next right thing close at hand.</p>
        </div>
        <div class="summary" aria-label="Task summary">
          <div class="summary-number" id="task-count">0</div>
          <div class="summary-label">total tasks</div>
        </div>
      </section>

      <div id="message" class="message" role="status" aria-live="polite" hidden></div>

      <section class="workspace-grid">
        <aside class="form-panel" aria-labelledby="form-heading">
          <div class="panel-heading">
            <p class="eyebrow">TASK DETAILS</p>
            <h2 id="form-heading">Add a task</h2>
          </div>
          <form id="task-form">
            <input id="task-id" type="hidden">
            <div class="field">
              <label for="title">Title <span aria-hidden="true">*</span></label>
              <input id="title" name="title" type="text" maxlength="255" placeholder="What needs doing?" required>
            </div>
            <div class="field">
              <label for="description">Description</label>
              <textarea id="description" name="description" rows="5" placeholder="Add a little context..."></textarea>
            </div>
            <div class="field">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option value="pending">Pending</option>
                <option value="in-progress">In progress</option>
                <option value="completed">Completed</option>
              </select>
            </div>
            <div class="form-actions">
              <button class="button button-primary" id="submit-button" type="submit">Add task</button>
              <button class="button button-text" id="cancel-button" type="button" hidden>Cancel</button>
            </div>
          </form>
        </aside>

        <section class="tasks-panel" aria-labelledby="tasks-heading">
          <div class="tasks-heading">
            <div>
              <p class="eyebrow">OVERVIEW</p>
              <h2 id="tasks-heading">All tasks</h2>
            </div>
            <span class="task-date" id="today"></span>
          </div>
          <div id="tasks-list" class="tasks-list" aria-live="polite">
            <div class="loading-state">Loading your tasks...</div>
          </div>
        </section>
      </section>
    </main>
    <footer>Taskboard <span aria-hidden="true">·</span> Stay in motion</footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
